}
const BRANCH_LOOKUP = {};
Object.keys(BRANCHES).forEach(a => (BRANCHES[a].qs || []).forEach(bq => { BRANCH_LOOKUP[bq.id] = bq; }));
const SHARED_LOOKUP = {};
SHARED.forEach(s => { SHARED_LOOKUP[s.id] = s; });

function currentId() { return state.flow[state.step]; }
function totalSteps() { return state.flow.length; }

function setProgress() {
  const pct = Math.round((state.step / totalSteps()) * 100);
  document.getElementById("bar").style.width = pct + "%";
  document.getElementById("stepCount").textContent =
    state.step < totalSteps() ? ("Step " + (state.step + 1) + " of " + totalSteps()) : "";
}

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ---------------- scoring (spec-exact) ---------------- */
function computeScores() {
  const A = state.answers;
  const arch = A.q_niche || "general";
  const sharedPts = { q_proof: SHARED_LOOKUP.q_proof.pts[A.q_proof],
                      q_response: SHARED_LOOKUP.q_response.pts[A.q_response],
                      q_followup: SHARED_LOOKUP.q_followup.pts[A.q_followup] };
  const shared = sharedPts.q_proof + sharedPts.q_response + sharedPts.q_followup; // max 70

  let branchPoints, branchDetail = [];
  const bqs = (BRANCHES[arch].qs || []).filter(bq => !bq.qualifier);
  if (arch === "general") {
    branchPoints = 15;
  } else {
    let sum = 0, max = 0;
    bqs.forEach(bq => {
      const p = bq.pts[A[bq.id]] || 0;
      branchDetail.push({ id: bq.id, pts: p });
      sum += p; max += 10;
    });
    branchPoints = max > 0 ? Math.round(30 * (sum / max)) : 0; // max 30
  }
  const total = Math.min(100, shared + branchPoints);
  const band = total <= 39 ? "critical" : total <= 69 ? "leaking" : "strong";
  const trauma = (A.q_trust_trauma === "burned" || A.q_trust_trauma === "disappointing") ? "skeptic" : "standard";
  const offerFit = (arch === "a2" && A.b2_5 === "under_1k") ? "low_ticket_review" : "fit_ok";
  return { shared, sharedPts, branchPoints, branchDetail, total, band, trauma, arch, offerFit };
}

function bandLabel(b) { return b === "critical" ? "Critical trust gaps" : b === "leaking" ? "Leaking trust" : "Strong foundation"; }

/* Gap extraction: rank scored answers by points asc; shared outrank branch on ties.
   Spec deviation (documented): answers scoring a perfect 10 render as "already solid"
   strengths instead of gaps, so a high scorer never sees a fake "gap". */
function extractGaps(scores) {
  const A = state.answers, ranked = [];
  ["q_proof", "q_response", "q_followup"].forEach(id => {
    ranked.push({ id, pts: scores.sharedPts[id], shared: true,
                  copy: (GAPS[id] || {})[A[id]] });
  });
  scores.branchDetail.forEach(bd => {
    ranked.push({ id: bd.id, pts: bd.pts, shared: false,
                  copy: (GAPS[bd.id] || {})[A[bd.id]] });
  });
  ranked.sort((x, y) => x.pts !== y.pts ? x.pts - y.pts : (x.shared === y.shared ? 0 : x.shared ? -1 : 1));
  const gaps = [], strengths = [];
  ranked.forEach(r => {
    if (r.copy) { if (gaps.length < 3) gaps.push(r); }
    else strengths.push(r);
  });
  while (gaps.length < 3 && strengths.length) gaps.push(strengths.shift());
  return gaps.slice(0, 3);
}

function questionLabel(id) {
  if (SHARED_LOOKUP[id]) return SHARED_LOOKUP[id].q;
  if (BRANCH_LOOKUP[id]) return BRANCH_LOOKUP[id].q;
  return id;
}
function optionLabel(id, val) {
  const src = SHARED_LOOKUP[id] || BRANCH_LOOKUP[id];
  if (!src) return val;
  const o = src.opts.find(x => x[0] === val);
  return o ? o[1] : val;
}

/* ---------------- screens ---------------- */
const screen = () => document.getElementById("screen");

function showIntro() {
  state.step = 0;
  screen().innerHTML = `
    <p class="eyebrow">UpFlex Digital · Trust Diagnostic</p>
    <h1>Can your buyers trust you before they ever call?</h1>
    <p class="lead">Answer a few quick questions. You'll get a trust score, your 3 biggest gaps,
    and the single fix that matters most — built for your kind of business.</p>
    <p class="lead" style="font-size:14px;">Takes about 2 minutes. Deterministic scoring — no AI guesswork.</p>
    <button class="btn" id="startBtn">Start the diagnostic</button>`;
  setProgress();
  document.getElementById("startBtn").onclick = () => { buildFlow(); state.step = 0; renderStep(); };
}

function renderStep() {
  const id = currentId();
  if (id === "contact") return renderContact();
  if (id === "q_open") return renderOpen(id);
  const q = SHARED_LOOKUP[id] || BRANCH_LOOKUP[id];
  const sub = q.sub ? `<p class="lead" style="font-size:14px;">${esc(q.sub)}</p>` : "";
  screen().innerHTML = `
    <p class="eyebrow">Question</p>
    <h2>${esc(q.q)}</h2>${sub}
    <div>${q.opts.map(o => `<button class="opt" data-v="${esc(o[0])}">${esc(o[1])}${o[2] ? `<small>${esc(o[2])}</small>` : ""}</button>`).join("")}</div>
    ${state.step > 0 ? `<div class="back-row"><button class="btn-ghost" id="backBtn">← Back</button></div>` : ""}`;
  setProgress();
  screen().querySelectorAll(".opt").forEach(b => b.onclick = () => {
    state.answers[id] = b.getAttribute("data-v");
    if (id === "q_niche") buildFlow(); // rebuild now that the branch is known
    state.step++;
    renderStep();
  });
  const back = document.getElementById("backBtn");
  if (back) back.onclick = () => { state.step--; renderStep(); };
}

function renderOpen(id) {
  const q = SHARED_LOOKUP[id];
  screen().innerHTML = `
    <p class="eyebrow">Question</p>
    <h2>${esc(q.q)}</h2>
    <p class="lead" style="font-size:14px;">${esc(q.sub)}</p>
    <textarea id="openText" placeholder="A sentence or two is plenty.">${esc(state.answers[id] || "")}</textarea>
    <button class="btn" id="openNext">Continue</button>
    <div class="back-row"><button class="btn-ghost" id="backBtn">← Back</button></div>`;
  setProgress();
  document.getElementById("openNext").onclick = () => {
    state.answers[id] = document.getElementById("openText").value.trim();
    state.step++; renderStep();
  };
  document.getElementById("backBtn").onclick = () => { state.step--; renderStep(); };
}

function renderContact() {
  screen().innerHTML = `
    <p class="eyebrow">Your results are ready</p>
    <h2>Where should we send your full report?</h2>
    <p class="lead" style="font-size:14px;">Enter your details to see your trust score and gaps.</p>
    <label class="field" for="f_name">Full name</label>
    <input type="text" id="f_name" autocomplete="name" value="${esc(state.answers._name || "")}">
    <label class="field" for="f_biz">Business name</label>
    <input type="text" id="f_biz" autocomplete="organization" value="${esc(state.answers._biz || "")}">
    <label class="field" for="f_phone">Phone</label>
    <input type="tel" id="f_phone" autocomplete="tel" placeholder="(555) 123-4567" value="${esc(state.answers._phone || "")}">
    <label class="field" for="f_email">Email</label>
    <input type="email" id="f_email" autocomplete="email" value="${esc(state.answers._email || "")}">
    ${priceBlockHTML()}
    <label class="consent"><input type="checkbox" id="f_consent">
      <span>I agree UpFlex Digital may contact me about my results by call, text, or email.</span></label>
    <div class="err" id="cErr">Please complete every field and check the consent box.</div>
    <button class="btn" id="submitBtn">See my trust score</button>
    <div class="back-row"><button class="btn-ghost" id="backBtn">← Back</button></div>`;
  setProgress();
  document.getElementById("submitBtn").onclick = () => {
    const v = id2 => document.getElementById(id2).value.trim();
    const name = v("f_name"), biz = v("f_biz"), phone = v("f_phone"), email = v("f_email");
    const consent = document.getElementById("f_consent").checked;
    const emailOk = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);
    const phoneOk = phone.replace(/\D/g, "").length >= 7;
    if (!name || !biz || !phoneOk || !emailOk || !consent) {
      document.getElementById("cErr").style.display = "block";
      return;
    }
    state.answers._name = name; state.answers._biz = biz;
    state.answers._phone = phone; state.answers._email = email;
    state.answers._consentAt = new Date().toISOString();
    renderResult();
  };
  document.getElementById("backBtn").onclick = () => { state.step--; renderStep(); };
}

function renderResult() {
  const s = computeScores();
  const A = state.answers;
  const headline = HEADLINES[s.arch][s.band];
  const gaps = extractGaps(s);
  const gapsHTML = gaps.map(g => g.copy
    ? `<div class="gap"><b>${esc(questionLabel(g.id))}</b><p>${esc(g.copy)}</p></div>`
    : `<div class="strength"><b>Already solid:</b> ${esc(optionLabel(g.id, A[g.id]))} — keep it up.</div>`).join("");

  // Highest-leverage fix: lowest-scoring shared question (priority: response, followup, proof)
  const order = ["q_response", "q_followup", "q_proof"];
  const worst = order.slice().sort((a, b) => s.sharedPts[a] - s.sharedPts[b])[0];
  const fixText = FIX_FIRST[worst];

  const skeptic = s.trauma === "skeptic"
    ? `<div class="skeptic-note">${SKEPTIC_PREPEND}</div>` : "";
  const fitNote = s.offerFit === "low_ticket_review"
    ? `<div class="skeptic-note"><strong>One honest note:</strong> with average jobs under $1,000, we'll want to make sure the numbers work before recommending a package — that's exactly what the Digital Growth Review is for.</div>` : "";

  const ringColor = s.band === "critical" ? "#b3261e" : s.band === "leaking" ? "#b3540c" : "#1e7e46";
  const circ = 2 * Math.PI * 64;
  const dash = (s.total / 100 * circ).toFixed(1);

  screen().innerHTML = `
    <p class="eyebrow">${esc(BRANCHES[s.arch].name)} · Result</p>
    <svg class="score-ring" viewBox="0 0 150 150">
      <circle cx="75" cy="75" r="64" fill="none" stroke="#e4e7ec" stroke-width="12"/>
      <circle cx="75" cy="75" r="64" fill="none" stroke="${ringColor}" stroke-width="12"
        stroke-linecap="round" stroke-dasharray="${dash} ${circ}" transform="rotate(-90 75 75)"/>
      <text x="75" y="72" text-anchor="middle" font-size="34" font-weight="800" fill="#14181f">${s.total}</text>
      <text x="75" y="94" text-anchor="middle" font-size="13" fill="#8a93a3">/ 100</text>
    </svg>
    <p class="band ${s.band}">${bandLabel(s.band)}</p>
    <h2 style="margin-top:14px;">${esc(headline)}</h2>
    ${skeptic}
    <p class="lead" style="font-size:15px;">${esc(WHAT_IT_MEANS[s.band])}</p>
    ${fitNote}
    <h2 style="font-size:19px; margin-top:22px;">Your 3 biggest trust gaps</h2>
    ${gapsHTML}
    <div class="fix-first"><b>Fix this first</b><p>${esc(fixText)}</p></div>
    <h2 style="font-size:19px; margin-top:22px;">What working together looks like</h2>
    <p class="lead" style="font-size:15px;">It starts with a <strong>Digital Growth Review</strong> — we look at your
    online presence the way your buyers do, then match you to the right package:</p>
    <div class="price-block" style="margin-top:4px;"><ul style="margin-top:0;">
      ${OFFER.packages.map(p => `<li><strong>${p.name}</strong> — ${p.setup} setup + ${p.monthly}: ${p.desc}</li>`).join("")}
      <li><strong>${OFFER.ads.name}</strong> — ${OFFER.ads.setup} setup + ${OFFER.ads.monthly}: ${OFFER.ads.desc}</li>
    </ul>
    <span style="font-size:13.5px; color:#5d6675;">No free trial — a signed agreement and the setup fee are required before any work begins.</span></div>
    <div class="proof-slot">Client results coming soon.<br><span style="font-size:12.5px;">Real proof only — this space stays empty until it's earned.</span></div>
    <button class="btn" id="ctaBtn">Get my full trust report + fix plan</button>
    <p class="fineprint">Submitting sends your full report instantly — then we reach out to book your Digital Growth Review.</p>`;
  document.getElementById("bar").style.width = "100%";
  document.getElementById("stepCount").textContent = "Done";
  document.getElementById("ctaBtn").onclick = renderConfirmation;
}

function renderConfirmation() {
  const s = computeScores();
  const A = state.answers;
  const leadRecord = {
    quiz_id: "upflex-trust-diagnostic-v1",
    source: "quiz-funnel-v1",
    completed_at: new Date().toISOString(),
    contact: {
      full_name: A._name, business_name: A._biz, phone: A._phone, email: A._email,
      marketing_consent: true, consent_captured_at: A._consentAt
    },
    scores: {
      trust_signals_score: s.total, band: s.band, archetype: s.arch,
      agency_trauma_flag: s.trauma, offer_fit_flag: s.offerFit
    },
    answers: Object.assign({}, A, { _name: "[redacted in demo]", _phone: "[redacted in demo]", _email: "[redacted in demo]" })
  };
  screen().innerHTML = `
    <p class="eyebrow">Preview confirmation</p>
    <h2>You're in. Here's what would happen next.</h2>
    <div class="confirm-box"><ul style="margin:0; padding-left:18px;">
      <li><strong>Your lead record is saved</strong> — answers, trust score (${s.total}/100, ${bandLabel(s.band)}), archetype, and consent timestamp.</li>
      <li><strong>Your full result is emailed instantly</strong> to ${esc(A._email)} — this is where UpFlex eats its own dogfood on speed-to-lead.</li>
      <li><strong>You're enrolled in follow-up</strong> — day 2 (your #1 fix), day 5 (what buyers check), day 9 (Digital Growth Review invitation).</li>
      <li><strong>A human reviews your result</strong> and reaches out to book the Digital Growth Review.</li>
    </ul></div>
    <p class="lead" style="font-size:14px;"><strong>Demo only:</strong> nothing was actually sent or saved anywhere —
    this page keeps no data and makes no network calls. In production this is where the CRM record, the instant
    email, and the nurture queue fire.</p>
    <p class="eyebrow" style="margin-top:18px;">Demo lead record (as it would be stored)</p>
    <pre class="demo">${esc(JSON.stringify(leadRecord, null, 2))}</pre>
    <button class="btn-ghost" id="restartBtn" style="margin-top:16px;">← Retake the diagnostic</button>`;
  document.getElementById("restartBtn").onclick = () => {
    state.answers = {}; state.step = 0; showIntro();
  };
}

showIntro();
</script>
